[tool.poetry]
name = "kurswork"
version = "0.1.0"
description = ""
authors = ["Борзунов Андрей <andry73@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
poetry-core = "^2.1.3"
pandas = "^2.3.1"
requests = "^2.32.5"
dotenv = "^0.9.9"
openpyxl = "^3.1.5"
pandas-stubs = "^2.3.0.250703"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.17.1"
black = "^25.1.0"
isort = "^6.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
(
    \.git
)
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'
